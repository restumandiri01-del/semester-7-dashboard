<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dashboard akademik pribadi Semester 7 — jadwal kuliah, beban SKS, aktivitas akademik, bimbingan, dan timeline kepanitiaan dalam satu tempat.">
  <meta name="color-scheme" content="light dark">

  <!-- Satu meta theme-color saja, dan nilainya diikuti JS ketika tema diganti
       manual. Dua meta berbasis prefers-color-scheme dulu membuat bilah peramban
       tetap terang saat pengguna memilih tema gelap sendiri. -->
  <meta name="theme-color" id="theme-color" content="#f7f6f3">

  <title>Semester 7 · Restu Mandiri</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Semester 7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Ini catatan akademik pribadi, bukan halaman yang ingin ditemukan mesin
       pencari. Metadata SEO dan Open Graph sengaja tidak ditambahkan. -->
  <meta name="robots" content="noindex">

  <!-- Terapkan tema sebelum paint pertama agar tidak ada kedipan warna.
       Sekaligus tandai bahwa JS aktif, supaya layar pembuka hanya muncul kalau
       memang ada yang bisa menutupnya lagi. Tanpa JS, layar pembuka tidak
       pernah tampil dan aplikasi langsung terlihat. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('s7os.theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e1413' : '#f7f6f3');
      } catch (e) { /* localStorage tidak tersedia - pakai default light */ }

      try {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reduce) document.documentElement.classList.add('is-booting');
      } catch (e) { /* tanpa matchMedia, lewati saja layar pembukanya */ }

      /* Manifest dipasang dari sini, bukan sebagai <link> statis. Saat halaman
         dibuka lewat file://, peramban menolak mengambil manifest karena CORS
         dan menuliskan peringatan merah di konsol — padahal manifest memang
         tidak ada gunanya di luar http/https. Memasangnya secara bersyarat
         menghilangkan peringatan itu tanpa mengurangi apa pun saat di-hosting. */
      try {
        if (location.protocol !== 'file:') {
          var link = document.createElement('link');
          link.rel = 'manifest';
          link.href = 'manifest.json';
          document.head.appendChild(link);
        }
      } catch (e) { /* tanpa manifest, aplikasi tetap berjalan penuh */ }
    })();
  </script>

  <!-- Playfair Display untuk judul, Plus Jakarta Sans untuk teks dan antarmuka.
       Kalau tidak ada koneksi, font fallback sistem di style.css langsung
       dipakai — aplikasi tetap tampil normal. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Layar pembuka. Dekoratif sepenuhnya: aria-hidden supaya pembaca layar
       langsung membaca konten asli, dan bisa dilewati dengan klik atau tombol
       apa pun. CSS-nya juga menutup layar ini sendiri setelah 3,2 detik, jadi
       halaman tetap terbuka walaupun script.js gagal dimuat sama sekali. -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-inner">
      <p class="intro-kicker">Academic OS</p>
      <p class="intro-title">Semester 7</p>
      <span class="intro-bar"><span class="intro-bar-fill"></span></span>
    </div>
  </div>

  <a class="skip-link" href="#main">Lewati ke konten utama</a>

  <header class="app-header">
    <div class="shell header-top">
      <div class="identity">
        <span class="avatar" aria-hidden="true" id="profile-initials"></span>
        <span class="identity-text">
          <span class="identity-name" id="profile-name"></span>
          <span class="identity-meta" id="profile-meta"></span>
        </span>
      </div>

      <div class="header-actions">
        <search class="search-field">
          <label class="sr-only" for="search-input">Cari mata kuliah, dosen, ruangan, atau aktivitas</label>
          <svg class="icon search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path>
          </svg>
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Cari mata kuliah, dosen, ruangan…"
            aria-describedby="search-hint">
          <span class="sr-only" id="search-hint">Tekan garis miring untuk fokus ke pencarian, Escape untuk menutup. Tekan Control atau Command tambah K untuk membuka perintah cepat.</span>
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
          <button type="button" class="search-clear" id="search-clear" hidden aria-label="Bersihkan pencarian">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="m6.5 6.5 11 11M17.5 6.5l-11 11"></path>
            </svg>
          </button>
        </search>

        <!-- Ctrl/Cmd+K tidak berarti apa-apa di layar sentuh, jadi perintah
             cepat juga punya tombolnya sendiri. -->
        <button type="button" class="icon-button" id="palette-button" aria-label="Buka perintah cepat">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.6" y="4.6" width="16.8" height="14.8" rx="2.6"></rect>
            <path d="m8.4 10.2 2.4 2.2-2.4 2.2M12.8 14.8h3"></path>
          </svg>
        </button>

        <button type="button" class="icon-button" id="theme-toggle" aria-label="Ganti tema">
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2.6v2.1M12 19.3v2.1M4.4 4.4l1.5 1.5M18.1 18.1l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.4 19.6l1.5-1.5M18.1 5.9l1.5-1.5"></path>
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.6A8.7 8.7 0 0 1 9.4 3.5a8.7 8.7 0 1 0 11.1 11.1Z"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="shell">
      <nav class="tabs" id="tabs" aria-label="Navigasi utama"></nav>
    </div>
  </header>

  <noscript>
    <div class="shell noscript-note">
      <p><strong>JavaScript sedang tidak aktif.</strong></p>
      <p>Jadwal, hitung mundur, dan peringatan bentrok di halaman ini dihitung
        langsung di peramban, jadi datanya tidak bisa ditampilkan tanpa
        JavaScript. Aktifkan JavaScript lalu muat ulang halaman.</p>
    </div>
  </noscript>

  <main class="shell" id="main" tabindex="-1">
    <div class="view" id="view-dashboard" data-view="dashboard" role="region" aria-label="Dashboard"></div>
    <div class="view" id="view-jadwal" data-view="jadwal" role="region" aria-label="Jadwal" hidden></div>
    <div class="view" id="view-aktivitas" data-view="aktivitas" role="region" aria-label="Aktivitas akademik" hidden></div>
    <div class="view" id="view-bimbingan" data-view="bimbingan" role="region" aria-label="Bimbingan akademik" hidden></div>
    <div class="view" id="view-mathfest" data-view="mathfest" role="region" aria-label="Timeline kepanitiaan Mathfest" hidden></div>
    <div class="view" id="view-search" data-view="search" role="region" aria-label="Hasil pencarian" hidden></div>
  </main>

  <footer class="app-footer">
    <div class="shell footer-inner">
      <span id="footer-identity"></span>
      <span class="footer-tools">
        <!-- Muncul hanya kalau peramban benar-benar menawarkan pemasangan. -->
        <button type="button" class="install-button" id="install-button" hidden>Pasang aplikasi</button>
        <span class="footer-note" id="footer-source">Menyiapkan data…</span>
      </span>
    </div>
  </footer>

  <p class="sr-only" id="live-region" aria-live="polite"></p>

  <!-- Urutan penting:
       data.js   menyediakan data cadangan sebagai variabel global
       sheets.js membaca cadangan itu, lalu mencoba Google Sheets
       script.js merender setelah sumber data selesai dimuat -->
  <script src="data.js"></script>
  <script src="sheets.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
